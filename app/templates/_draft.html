{# Draft message to the owner of a to-be exception (drafts.py), returned to HTMX. #}
<div class="draft-box" id="draft-box">
  {% if draft %}
  <p class="draft-label">{{ draft_label }}</p>
  <blockquote class="draft-text">{{ draft.text }}</blockquote>
  <p class="muted small"><code>{{ draft.model }}</code> · {{ 'from cache' if draft.from_cache else 'new draft' }}</p>
  <form method="post" action="/invoice/{{ doc.doc_id }}/draft?force=1"
        hx-post="/invoice/{{ doc.doc_id }}/draft?force=1" hx-target="#draft-box" hx-swap="outerHTML"
        hx-disabled-elt="find button">
    <button type="submit" class="secondary outline small-button">Draft again</button>
  </form>
  {% else %}
  <p class="flash flash-warn draft-unavailable" role="status"><strong>No draft.</strong> {{ draft_error }}</p>
  <form method="post" action="/invoice/{{ doc.doc_id }}/draft"
        hx-post="/invoice/{{ doc.doc_id }}/draft" hx-target="#draft-box" hx-swap="outerHTML"
        hx-disabled-elt="find button">
    <button type="submit" class="secondary outline small-button">Try again</button>
  </form>
  {% endif %}
</div>
