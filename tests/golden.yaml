# Scenario-level numbers. The four metrics of deck slide 11 with the A6 definitions (metrics.py), plus the counts
# behind them that follow directly from the decisions.
kpis:
  asis:
    documents: 12
    touchless: 0              # AP keys every document: no Post without a human step
    exceptions: 8             # all in the untracked email loop
    exceptions_by_type: {email_loop: 8}
    duplicates_blocked: 0
    duplicate_invoices: 1     # Nordwind posted on V-000101 (doc 1) and again on V-000117 (doc 2)
    credit_notes_applied: 0
    credit_notes_unapplied: 1 # doc 4 on V-000119
    wrong_entity_postings: 1  # doc 10 Cleanspace, billed to VFR, posted to VDE
    first_pass_match_rate: 27.3   # 3 of 11 invoices (docs 3, 7, 8)
    accounts_per_supplier: 2.33   # 28 records / 12 suppliers
    touchless_rate: 0.0           # 0 of 12 posted
    cycle_time_median: 15.0       # median of 2, 2, 2, 2, 15, 15, 15, 16, 16, 21, 21, 27
    registered_same_day: 0.0      # ap@ +1 business day, store mailbox +7
  tobe:
    documents: 12
    touchless: 8              # docs 3, 4, 7, 8, 9, 10, 11, 12
    exceptions: 3             # doc 1 Human review, docs 5 and 6 Exceptions
    exceptions_by_type: {amount_above_approval_limit: 1, po_no_receipt: 1, price_qty_mismatch: 1}
    duplicates_blocked: 1     # doc 2
    duplicate_invoices: 0
    credit_notes_applied: 1
    credit_notes_unapplied: 0
    wrong_entity_postings: 0
    first_pass_match_rate: 72.7   # 8 of 11 (docs 1, 3, 7, 8, 9, 10, 11, 12; not 2 Block, 5, 6)
    accounts_per_supplier: 1.17   # 14 records / 12 suppliers
