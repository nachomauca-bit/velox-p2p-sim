# Expected control-gate result per case document and scenario, with the ground-truth (fixture) extraction.
# Source: brief v2 (25 Sep 2026, CLAUDE_CODE_BRIEF_v2_alignment_with_final_deck.md) and the final deck: twelve case
# documents (the original brief's 8 Metro Media and 12 Lumen dropped), four outcomes (Post / Exception / Block /
# Human review), the A3 taxonomy, the approval limit (CHF 25,000, simulated), card / catalogue for small store
# purchases, as-is = AP keys every document (no gate). Drives tests/test_golden.py (all twelve loaded; the demo holds
# document 5 back until "Receive next email").
#
# Keys compared when present (see gate.py for their meaning):
#   outcome, exception_type, owner_name, next_owner_name, sla_days, account (vendor account used), resolution_method,
#   posted (a posted invoice was written), posted_entity, wrong_entity_posting, duplicate_posting, duplicate_of,
#   commitment (po | contract | catalogue | none), po_number, contract_id, catalogue_id, credit_status, flags,
#   touchless, first_pass_match, terms_source, terms_days, simulated_days
#
# Why each to-be result:
#   1 Nordwind       contract CT-2025-001 matched, 27,846.00 EUR ~ CHF 26,175 > CHF 25,000 -> Human review, next approver
#   2 Nordwind copy  a reminder reproducing invoice NWL-2026-00913 (same number as B-01) -> Block, AP replies
#   3 Bright         PO + service confirmation -> Post
#   4 Bright credit  linked to invoice INV-2026-0457 -> Post (credit note)
#   5 FitOut         PO 4500123 without service confirmation -> Exception to the requester (deck A5), SLA 2
#   6 Atlas          44.00 vs PO 42.00 -> Exception to the buyer, SLA 2, resolved 3 days late (the one past SLA)
#   7 Shopsys, 8 QuickPrint, 11 SecureNet  PO + receipt / confirmation -> Post
#   9 Kaffee         catalogue CAT-2026-001, 180.00 EUR ~ CHF 169 within CHF 500 -> Post
#   10 Cleanspace    contract CT-2025-003 (VFR record) -> Post;  12 Harbor  contract CT-2025-004 -> Post
# As-is: AP keys every document and picks an account by name; 8 of 12 go through the untracked email loop (the
# simulated days are unchanged by the renumbering: sim.email_loop_days is seeded by each document's loop key).

